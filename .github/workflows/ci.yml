name: Denetim

# Kod değişikliklerinde tip, lint ve testler. Yalnızca veri commit'leri
# (data/**) tetiklemez — onlar günlük iş ve haber işinden gelir.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PageProps/LayoutProps derlemede üretilir; temiz ortamda önce üretilmeli.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
