name: Denetim

# Kod değişikliklerinde tip, lint ve testler. Yalnızca veri commit'leri
# (data/**) tetiklemez — onlar günlük iş ve haber işinden gelir.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PageProps/LayoutProps derlemede üretilir; temiz ortamda önce üretilmeli.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Erişilebilirlik: siteyi derleyip gerçek tarayıcıda axe ile tara
      # (390 ve 1280 px; ciddi/kritik ihlal varsa kırmızı). Bkz. scripts/a11y-check.ts.
      - run: npx playwright install --with-deps chromium
      - run: npx next build
      - name: Erişilebilirlik denetimi
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/rss.xml && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/rss.xml
          npm run a11y
