name: Denetim

# Kod değişikliklerinde tip, lint ve testler. Yalnızca veri commit'leri
# (data/**) tetiklemez — onlar günlük iş ve haber işinden gelir.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PageProps/LayoutProps derlemede üretilir; temiz ortamda önce üretilmeli.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
