name: Veriyi güncelle

# Her gün 08:00 TRT (05:00 UTC) — plandaki günlük veri çekme işi.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Kaynaklar birbirinden bağımsızdır: biri kırılınca (ör. Atlanta Fed
      # dosyayı taşıdığında) diğerlerinin verisi yine commit'lenmeli. Hata
      # gizlenmez — iş yine kırmızı biter; continue-on-error bunu yeşile
      # boyardı ve kırılma haftalarca fark edilmezdi.
      - run: npm run fetch:meetings
      - run: npm run fetch:rates
        if: ${{ !cancelled() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
      - run: npm run fetch:current-rates
        if: ${{ !cancelled() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
      - run: npm run fetch:probabilities
        if: ${{ !cancelled() }}
      - run: npm run fetch:speeches
        if: ${{ !cancelled() }}
      # Skorlama isteğe bağlıdır: ANTHROPIC_API_KEY yoksa ya da kredi
      # bittiyse script tek tek hata yazar ama 0 ile çıkar. Böylece ücretsiz
      # kaynaklardan gelen veri (takvim, faiz, olasılık, konuşma metinleri)
      # yine commit'lenir; konuşmalar skorsuz olarak siteye düşer.
      - run: npm run score:speeches
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Script'ler her koşuda fetchedAt'i yeniler; yalnızca damga değiştiyse
      # commit atmak her gün boş bir commit ve gereksiz bir Vercel dağıtımı
      # üretiyordu. Cron'un çalışıp çalışmadığı Actions geçmişinden izlenir.
      - name: Değişiklik varsa commit'le
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -I '"fetchedAt"' -- data/seed \
             && [[ -z "$(git ls-files --others --exclude-standard data/seed)" ]]; then
            echo "Veride değişiklik yok (yalnızca fetchedAt)."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/seed
            git commit -m "chore: takvim ve piyasa verisini güncelle"
            git push
          fi
